# emailsaty — Cloudflare Worker config.
# NEW account only (mmody1330@gmail.com). Do NOT deploy from / to the
# old Filmaty/SaveLink account.
#
# account_id for the NEW account (mmody1330@gmail.com).
account_id = "a5aa88e4862fd0f6b4652d92337e902b"

name = "emailsaty"
main = "src/worker.ts"
compatibility_date = "2026-11-17"

# D1 database — create once on the new account:
#   wrangler d1 create emailsaty-db
# then paste the returned database_id below and run schema.sql.
[[d1_databases]]
binding = "DB"
database_name = "emailsaty-db"
database_id = "d7935a6f-f6be-42f2-8643-945ad6bea548"

# Free domain — ONLY mail.elkabsula.site (subdomain of a domain Mohamed
# already owns — $0 extra). No other primary domain.
# ⚠️ RECEIVING: a mail.elkabsula.site zone cannot be created on a free
# account (Cloudflare error 1116, subdomain zones are Enterprise-only).
# Receiving happens in the OLD account (elkabsula.site zone) via Email
# Routing + the relay Worker (see wrangler-relay.toml); this Worker only
# stores mail in D1. See README "Relay architecture".
[vars]
DOMAINS = "mail.elkabsula.site"
TELEGRAM_CHAT_ID = "736161596"

# Secrets (never in this file — set with wrangler secret put):
#   TELEGRAM_BOT_TOKEN   — DEFERRED (2026-11-17): only set this later
#   to re-enable Telegram notifications; the Worker skips notify
#   when it is unset, and the deploy workflow needs no Telegram secret.
#   INGEST_SECRET       — shared secret for POST /api/ingest. MUST be
#   the exact same value as INGEST_SECRET on the relay Worker
#   (wrangler-relay.toml, old account). Generate with:
#   openssl rand -hex 32   — then `wrangler secret put INGEST_SECRET`
#   in BOTH accounts. Never put it in this repo.
#
# Receiving (relay design, 2026-11-17): this Worker does NOT receive
# mail directly — a mail.elkabsula.site zone cannot exist on a free
# account (Cloudflare error 1116, subdomain zones are Enterprise-only).
# The OLD account receives via Email Routing on the elkabsula.site zone
# and the relay Worker (src/relay-worker.ts) forwards each message to
# POST /api/ingest here. This Worker's own email() entry is kept as a
# fallback only. HARD RULE: relay setup must never touch الكبسولة —
# only mail-subdomain MX + a routing rule for @mail.elkabsula.site.
