name: 24/7 Inbox Monitor & Telegram Alerts

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram Chat ID to notify'
        required: false
      inboxes:
        description: 'Comma-separated inboxes to check'
        required: false

jobs:
  check-inboxes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Background Monitor
        run: node scripts/check-inboxes.mjs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN || '8576873952:AAFD919csZ1CWTKZv-fG5v7J8lGzUYCEtI4' }}
          CHAT_ID: ${{ secrets.CHAT_ID || inputs.chat_id }}
          ACTIVE_INBOXES: ${{ secrets.ACTIVE_INBOXES || inputs.inboxes }}
